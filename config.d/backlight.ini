; Screen brightness, scroll to change it. Only on the laptop bar, internal modules have no exec-if.

[module/backlight]
type                            = internal/backlight

card                            = ${env:POLYBAR_BACKLIGHT:intel_backlight}
use-actual-brightness           = true
poll-interval                   = 0
enable-scroll                   = true
scroll-interval                 = 10

format                          = <label> <bar>
label                           = %{T2}󰌵%{T-} %percentage%%

label-foreground                = ${colors.foreground}
label-background                = ${colors.background}

bar-width                       = 15
bar-gradient                    = false
bar-indicator                   = |
bar-fill                        = ─
bar-empty                       = ─

bar-foreground-0                = ${colors.ok}
bar-foreground-1                = ${colors.ok}
bar-foreground-2                = ${colors.ok}
bar-foreground-3                = ${colors.ok}
bar-foreground-4                = ${colors.ok}
bar-foreground-5                = ${colors.warning}
bar-foreground-6                = ${colors.alert}

bar-empty-foreground            = ${colors.foreground}
bar-empty-background            = ${colors.background}
