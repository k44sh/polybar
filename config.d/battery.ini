; Battery level. Only the laptop bar carries it.

[module/battery]
type                            = internal/battery

battery                         = ${env:POLYBAR_BATTERY:BAT1}
full-at                         = 99
low-at                          = 5
poll-interval                   = 30

format-charging                 = <label-charging>
format-discharging              = %{T2}<ramp-capacity>%{T-} <label-discharging>
format-full                     = <label-full>
format-low                      = <label-low>

label-charging                  = %{T2}󰂄%{T-} %percentage%%
label-discharging               = %percentage%%
label-full                      = %{T2}󰁹%{T-} Full
label-low                       = %{T2}󰂃%{T-} Low

ramp-capacity-0                 = 󰁺
ramp-capacity-1                 = 󰁼
ramp-capacity-2                 = 󰁾
ramp-capacity-3                 = 󰂀
ramp-capacity-4                 = 󰁹

format-charging-foreground      = ${colors.foreground}
format-charging-background      = ${colors.background}
format-discharging-foreground   = ${colors.foreground}
format-discharging-background   = ${colors.background}
format-full-foreground          = ${colors.foreground}
format-full-background          = ${colors.background}
format-low-foreground           = ${colors.alert}
format-low-background           = ${colors.background}
