; Every colour the bar uses. Two places must repeat a value instead of referencing it:
;   - the scripts, which cannot read a polybar section,
;   - anything inside a %{F...} tag, where polybar does not expand ${...}.

[colors]
; Bar surface.
transparent                     = #00000000
background                      = #AA060B15
foreground                      = #E6E6E6

; States. alert doubles as the red hue.
alert                           = #EC0101
warning                         = #F5A70A
ok                              = #55AA55

; Hues referenced by name. green has no ini reference, it is the source the
; scripts copy by value.
white                           = #E6E6E6
black                           = #000000
green                           = #98C379
orange                          = #D19A66

; Module accents, drawn as format-underline. Neighbouring modules never share a hue.
accent-gpu                      = #75AA55
accent-system                   = #55A9AA
accent-fs                       = #555AAA
accent-fs-data                  = #AA5564
accent-wlan                     = #9F78E1
accent-eth                      = #AA55A9
accent-vpn                      = #AA8B55
accent-date                     = #0A6CF5

; Separator tint, shared by the sep module and the date.
separator                       = #30E6E6E6
