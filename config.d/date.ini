; Date and clock. A click swaps to the clock alone.

[module/date]
type                            = internal/date
interval                        = 1

date                            = %d %b %{F#30E6E6E6}|%{F-} %H:%M:%S
date-alt                        = %H:%M:%S

format                          = <label>
label                           = %date%

format-foreground               = ${colors.foreground}
format-background               = ${colors.background}
format-underline                = ${colors.accent-date}
