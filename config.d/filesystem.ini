; Disk usage, red past the threshold set in each exec. fs-data hides while its mount point is absent.
; Shell syntax, not ${env:...}: polybar does not expand its own form inside a command.

[module/fs-system]
type                            = custom/script
interval                        = 30

exec                            = df -m --output=size,used,pcent / | awk 'NR==2 {gsub("%","",$3); s=sprintf("/ %d%% (%.0f/%.0f Go)", $3, $2/1024, $1/1024); if ($3>=75) s="%{F#EC0101}" s "%{F-}"; print s}'

format                          = <label>
label                           = %{T2}󰋊%{T-} %output%

format-foreground               = ${colors.foreground}
format-background               = ${colors.background}
format-underline                = ${colors.accent-fs}

click-left                      = nemo --no-desktop &

[module/fs-data]
type                            = custom/script
interval                        = 30

exec-if                         = mountpoint -q "$POLYBAR_DATA_MOUNT"
exec                            = df -m --output=size,used,pcent "$POLYBAR_DATA_MOUNT" | awk -v m="$POLYBAR_DATA_MOUNT" 'NR==2 {gsub("%","",$3); s=sprintf("%s %d%% (%.0f/%.0f Go)", m, $3, $2/1024, $1/1024); if ($3>=80) s="%{F#EC0101}" s "%{F-}"; print s}'

format                          = <label>
label                           = %{T2}󰋊%{T-} %output%

format-foreground               = ${colors.foreground}
format-background               = ${colors.background}
format-underline                = ${colors.accent-fs-data}

click-left                      = nemo --no-desktop "$POLYBAR_DATA_MOUNT" &
