; NVIDIA load, temperature and video memory. One nvidia-smi call feeds all three.

[module/gpu]
type                            = custom/script
interval                        = 2

exec                            = ~/.config/polybar/scripts/nvidia.sh

format                          = <label>
label                           = %output%

format-foreground               = ${colors.foreground}
format-background               = ${colors.background}
format-underline                = ${colors.accent-gpu}
