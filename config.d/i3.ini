; Workspace buttons. Scrolling is off, so the wrapping and reverse scroll keys are absent.

[module/i3]
type                            = internal/i3

pin-workspaces                  = true
index-sort                      = true
enable-click                    = true
enable-scroll                   = false

label-focused                   = %{T2}󰝥%{T-} %index%
label-unfocused                 = %{T2}󰝥%{T-} %index%
label-visible                   = %{T2}󰝥%{T-} %index%
label-urgent                    = %{T2}󰝥%{T-} %index%

label-focused-foreground        = ${colors.foreground}
label-focused-background        = ${colors.background}
label-focused-underline         = ${colors.white}
label-focused-padding           = 1

label-unfocused-foreground      = ${colors.foreground}
label-unfocused-background      = ${colors.background}
label-unfocused-padding         = 1

label-visible-foreground        = ${colors.foreground}
label-visible-background        = ${colors.background}
label-visible-underline         = ${colors.white}
label-visible-padding           = 1

label-urgent-foreground         = ${colors.alert}
label-urgent-background         = ${colors.background}
label-urgent-underline          = ${colors.alert}
label-urgent-padding            = 1

; Current i3 mode, shown only while a mode such as resize is active.
label-mode                      = %mode%
label-mode-padding              = 1
label-mode-foreground           = ${colors.black}
label-mode-background           = ${colors.orange}
