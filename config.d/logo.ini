; Launcher button. On font-2 so the distro mark stays larger than the module icons.

[module/logo]
type                            = custom/text

format                          = <label>
label                           = %{T3}%{T-}

format-padding                  = 1
format-foreground               = ${colors.foreground}
format-background               = ${colors.background}

click-left                      = rofi -show drun
