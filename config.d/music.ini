; Spotify, followed over MPRIS. The script never exits, interval is only the respawn delay.

[module/spotify]
type                            = custom/script
tail                            = true
interval                        = 1

exec                            = ~/.config/polybar/scripts/spotify.sh

format                          = <label>
label                           = %output%

format-foreground               = ${colors.foreground}
format-background               = ${colors.background}

click-left                      = playerctl -p spotify play-pause
; Anchored so a browser tab of open.spotify.com cannot match instead.
click-middle                    = i3-msg '[class="(?i)^spotify$"] focus'
click-right                     = i3-msg '[class="(?i)^spotify$"] focus'
scroll-up                       = playerctl -p spotify next
scroll-down                     = playerctl -p spotify previous
