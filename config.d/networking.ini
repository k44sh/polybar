; Network links, one module per numbered slot. To add one, copy its block and declare its variable.
; Interfaces are named explicitly, a machine can carry several cards of the same kind.
; vpn0 is a script because a wireguard interface keeps an operstate internal/network reads as down.

[module/wlan0]
type                            = internal/network
interface                       = ${env:POLYBAR_WLAN0:wlp131s0f0}
interval                        = 2

format-connected                = %{A1:~/.config/polybar/scripts/wifi.sh &:}<ramp-signal> <label-connected>%{A}
format-disconnected             = %{A1:~/.config/polybar/scripts/wifi.sh &:}<label-disconnected>%{A}

label-connected                 = %signal%% %essid% %local_ip% ↓%downspeed% ↑%upspeed%
label-disconnected              = %{T2}󰤭%{T-} %ifname%

ramp-signal-0                   = %{T2}󰤟%{T-}
ramp-signal-1                   = %{T2}󰤢%{T-}
ramp-signal-2                   = %{T2}󰤥%{T-}
ramp-signal-3                   = %{T2}󰤨%{T-}

format-connected-foreground     = ${colors.foreground}
format-connected-background     = ${colors.background}
format-disconnected-foreground  = ${colors.foreground}
format-disconnected-background  = ${colors.background}
format-connected-underline      = ${colors.accent-wlan}
format-disconnected-underline   = ${colors.accent-wlan}

[module/eth0]
type                            = internal/network
interface                       = ${env:POLYBAR_ETH0:enp132s0}
interval                        = 2

format-connected                = <label-connected>
format-disconnected             = <label-disconnected>

label-connected                 = %{T2}󰈀%{T-} %ifname% %local_ip% ↓%downspeed% ↑%upspeed%
label-disconnected              = 

format-connected-foreground     = ${colors.foreground}
format-connected-background     = ${colors.background}
format-disconnected-foreground  = ${colors.foreground}
format-disconnected-background  = ${colors.background}
format-connected-underline      = ${colors.accent-eth}
format-disconnected-underline   = ${colors.accent-eth}

[module/vpn0]
type                            = custom/script
interval                        = 2

exec                            = ~/.config/polybar/scripts/vpn.sh

format                          = <label>
label                           = %output%

format-foreground               = ${colors.foreground}
format-background               = ${colors.background}
format-underline                = ${colors.accent-vpn}

click-left                      = ~/.config/polybar/scripts/vpn.sh --toggle &
