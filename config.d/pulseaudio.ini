; Output volume and microphone. Left click mutes, right click picks the device, middle opens pavucontrol.
; Internal modules ignore click-*, so the volume module carries its actions in %{A} tags.

[module/pulseaudio]
type                            = internal/pulseaudio

format-volume                   = <label-volume> %{A3:~/.config/polybar/scripts/audio.sh sink &:}%{A2:pavucontrol &:}<bar-volume>%{A}%{A}
format-muted                    = <label-muted> %{A3:~/.config/polybar/scripts/audio.sh sink &:}%{A2:pavucontrol &:}<bar-volume>%{A}%{A}

label-volume                    = %{A1:pactl set-sink-mute @DEFAULT_SINK@ toggle:}%{A3:~/.config/polybar/scripts/audio.sh sink &:}%{A2:pavucontrol &:}%{T2}󰓃%{T-} %percentage%%%{A}%{A}%{A}
label-muted                     = %{A1:pactl set-sink-mute @DEFAULT_SINK@ toggle:}%{A3:~/.config/polybar/scripts/audio.sh sink &:}%{A2:pavucontrol &:}%{T2}%{F#EC0101}󰖁%{F-}%{T-} %percentage%%%{A}%{A}%{A}

label-volume-foreground         = ${colors.foreground}
label-volume-background         = ${colors.background}
label-muted-foreground          = ${colors.foreground}
label-muted-background          = ${colors.background}

bar-volume-width                = 15
bar-volume-gradient             = false
bar-volume-indicator            = |
bar-volume-fill                 = ─
bar-volume-empty                = ─

bar-volume-foreground-0         = ${colors.ok}
bar-volume-foreground-1         = ${colors.ok}
bar-volume-foreground-2         = ${colors.ok}
bar-volume-foreground-3         = ${colors.ok}
bar-volume-foreground-4         = ${colors.ok}
bar-volume-foreground-5         = ${colors.warning}
bar-volume-foreground-6         = ${colors.alert}

bar-volume-empty-foreground     = ${colors.foreground}
bar-volume-empty-background     = ${colors.background}

[module/mic]
type                            = custom/script
interval                        = 2

exec                            = ~/.config/polybar/scripts/mic.sh

format                          = <label>
label                           = %output%

format-foreground               = ${colors.foreground}
format-background               = ${colors.background}

click-left                      = ~/.config/polybar/scripts/mic.sh --toggle &
click-middle                    = pavucontrol &
click-right                     = ~/.config/polybar/scripts/audio.sh source &
