; Polybar configuration for i3.
;
; Author: καsн (https://github.com/k44sh/polybar)

; Entry point. Modules live in config.d, one file per subject, colours in config.d/colors.ini.
;
; Three bars, one per screen arrangement. The launcher picks between them.
;   main        an external output, always the full bar
;   laptop      the internal panel used alone, full bar plus backlight
;   secondary   the internal panel next to an external one, cut down to what main cannot show

[global/wm]
include-file                    = $HOME/.config/polybar/config.d/backlight.ini
include-file                    = $HOME/.config/polybar/config.d/battery.ini
include-file                    = $HOME/.config/polybar/config.d/colors.ini
include-file                    = $HOME/.config/polybar/config.d/cpu.ini
include-file                    = $HOME/.config/polybar/config.d/date.ini
include-file                    = $HOME/.config/polybar/config.d/filesystem.ini
include-file                    = $HOME/.config/polybar/config.d/gpu.ini
include-file                    = $HOME/.config/polybar/config.d/i3.ini
include-file                    = $HOME/.config/polybar/config.d/logo.ini
include-file                    = $HOME/.config/polybar/config.d/music.ini
include-file                    = $HOME/.config/polybar/config.d/networking.ini
include-file                    = $HOME/.config/polybar/config.d/notifications.ini
include-file                    = $HOME/.config/polybar/config.d/powermenu.ini
include-file                    = $HOME/.config/polybar/config.d/pulseaudio.ini
include-file                    = $HOME/.config/polybar/config.d/separator.ini
include-file                    = $HOME/.config/polybar/config.d/xwindow.ini

screenchange-reload             = true
pseudo-transparency             = true

[bar/main]
monitor                         = ${env:MONITOR:}
override-redirect               = false
enable-ipc                      = true
locale                          = fr_FR.UTF-8

width                           = 100%
height                          = 4%
radius                          = 5
offset-x                        = 1%
offset-y                        = 1%

background                      = ${colors.background}
foreground                      = ${colors.foreground}

border-size                     = 4
border-color                    = ${colors.transparent}

padding-left                    = 1
padding-right                   = 2
module-margin                   = 1
line-size                       = 3

; One Hack Nerd Font install, the variant marks the role. Never the plain one: it gives every glyph a
; single text cell while the drawing runs wider, so wide icons overrun their label.
;   font-0  Mono, the text. Also clamps an untagged icon instead of letting it overrun.
;   font-1  Propo, every module icon, via %{T2}. Propo fits each advance to its drawing.
;   font-2  Propo, the launcher logo alone, via %{T3}.
; Size 11 is the largest size where all 33 icons rasterise to one height.
font-0                          = Hack Nerd Font Mono:style=Bold:size=9
font-1                          = Hack Nerd Font Propo:style=Bold:size=11
font-2                          = Hack Nerd Font Propo:style=Bold:size=15

; The sep module is a plain rule between groups. The bar-wide separator key stays empty.
modules-left                    = logo i3 xwindow sep spotify
modules-center                  = date
modules-right                   = gpu sep cpu sep fs-system fs-data sep wlan0 eth0 vpn0 sep dunst mic pulseaudio battery powermenu

cursor-click                    = pointer
cursor-scroll                   = ns-resize

[bar/laptop]
; Internal panel on its own. Same as main, plus backlight, which no other bar can carry.
inherit                         = bar/main

modules-right                   = gpu sep cpu sep fs-system fs-data sep wlan0 eth0 vpn0 sep dunst backlight mic pulseaudio battery powermenu

[bar/secondary]
; Internal panel next to an external one. Only what main does not already show.
inherit                         = bar/main

modules-left                    = i3 xwindow
modules-center                  = date
modules-right                   = spotify sep backlight sep battery
